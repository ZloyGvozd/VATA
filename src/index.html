<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>VATA - minecraft deauthenticator</title>
    <link href="./output.css" rel="stylesheet">
    <link href="./custom.css" rel="stylesheet">
</head>
<body class="bg-neutral-900 h-screen flex flex-col justify-start items-center gap-3 p-4 pt-0">
    <h1 class="text-red-500 font-bold text-7xl select-none">VATA</h1>
    <input id="address_input" class="input-primary" spellcheck="false" placeholder="address:port">
    <hr class="h-px bg-neutral-700 border-0 w-full">
    <input id="spy_nick_input" class="input-primary" spellcheck="false" placeholder="spy nickname">
    <textarea id="allowed_players_input" class="input-primary resize-none overflow-hidden" spellcheck="false" style="min-height: 60px;" placeholder="allowed players (comma separated)" oninput="this.style.height = 'auto'; this.style.height = (this.scrollHeight + 4) + 'px';"></textarea>
    <hr class="h-px bg-neutral-700 border-0 w-full">
    <div id="executes" class="w-full h-full flex flex-col justify-start items-center gap-3 overflow-y-auto">
        <div class="flex justify-center items-center gap-4">
            <p class="text-neutral-300 font-mono select-none">try cmd (or just write chat)</p>
            <button id="add_execute_element" class="bg-red-500 text-neutral-50 w-8 h-8 rounded-lg grid place-items-center text-2xl active:scale-90 transition-all"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6 hover:size-7 transition-all"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/></svg></button>
        </div>
        <div class="w-full bg-neutral-950 rounded-2xl p-4 flex flex-col justify-between items-center gap-4 execute_element">
            <div class="w-full flex justify-center items-center gap-4">
                <select class="input-primary w-min h-full type_selector">
                    <option value="type">Type chat</option>
                    <option value="type">Drop items</option>
                </select>
                <input class="input-primary element_nick_selector" placeholder='nicks, or empty to all'>
            </div>
            <div class="w-full flex justify-center items-center gap-3">
                <input class="input-primary element_cmd_selector" spellcheck="false" placeholder='parameters'>
                <button onclick="kill_execute_element(this)" class="bg-red-500 text-neutral-50 w-8 h-8 shrink-0 rounded-lg grid place-items-center text-2xl active:scale-90 transition-all"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6"><path stroke-linecap="round" stroke-linejoin="round" d="M15 12H9m12 0a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" /></svg></button>
            </div>
        </div>
    </div>
    <button id="start_btn" class="mt-auto w-full bg-red-500 rounded-xl font-mono text-neutral-50 text-2xl p-4 shadow-[10px_10px_11px_-10px_rgba(0,_0,_0,_0.1)] focus:outline-none focus:shadow-[10px_10px_11px_0px_rgba(0,_0,_0,_0.1)] hover:shadow-[10px_10px_11px_0px_rgba(0,_0,_0,_0.1)] active:scale-90 transition-all">
        START
    </button>
    <script>
        const address_input = document.getElementById("address_input")
        const start_btn = document.getElementById("start_btn")
        const spy_nick_input = document.getElementById("spy_nick_input")
        const allowed_players_input = document.getElementById("allowed_players_input")
        start_btn.onclick = () => {
            const execute_elements = document.querySelectorAll(".execute_element")

            let execute_params = []

            execute_elements.forEach((element) => {
                execute_params.push({
                    type: element.querySelector(".type_selector").options[element.querySelector(".type_selector").selectedIndex].text,
                    nicks: element.querySelector(".element_nick_selector").value,
                    cmd: element.querySelector(".element_nick_selector").value
                })
            })

            const params = {
                address: address_input.value,
                spy_nick: spy_nick_input.value,
                allowed_players: allowed_players_input.value,
                execute_params: execute_params
            }
            window.electronAPI.start(params)
        }
    </script>
    <script>
        const executes = document.getElementById("executes")
        const add_execute_element = document.getElementById("add_execute_element")
        const first_example = document.getElementsByClassName("execute_element")[0].outerHTML

        add_execute_element.onclick = () => {
            executes.insertAdjacentHTML('beforeend', first_example);
        }

        const kill_execute_element = (element) => {
            const to_del = element.parentNode.parentNode
            if(to_del){
                to_del.remove()
            }
        }
    </script>
</body>
</html>
